<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise — Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

<!-- HEADER -->
<header>
    <div class="logo">
        <span class="logo-icon">💰</span>
        SpendWise
    </div>
    <div class="header-right">
        <div class="month-filter">
            <label>Month</label>
            <input type="month" id="monthFilter" onchange="loadAll()">
        </div>
        <div class="user-menu">
            <div class="avatar" id="avatarBtn" onclick="toggleUserMenu()">
                <span id="avatarLetter">A</span>
            </div>
            <div class="user-dropdown" id="userDropdown">
                <div class="user-info">
                    <div class="user-name" id="dropdownName">User</div>
                    <div class="user-email" id="dropdownEmail">—</div>
                </div>
                <hr class="dropdown-hr">
                <button class="logout-btn" onclick="logout()">🚪 Logout</button>
            </div>
        </div>
    </div>
</header>

<!-- MAIN -->
<div class="main">

    <!-- LEFT PANEL -->
    <div class="left-panel">

        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-card">
                <div>
                    <div class="stat-label">Total Spent</div>
                    <div class="stat-value accent" id="totalAmount">₹0</div>
                </div>
                <span style="font-size:28px">💸</span>
            </div>
            <div class="stat-card">
                <div>
                    <div class="stat-label">Transactions</div>
                    <div class="stat-value green" id="totalCount">0</div>
                </div>
                <span style="font-size:28px">📋</span>
            </div>
        </div>

        <!-- Add Form -->
        <div class="form-card">
            <div class="form-title">Add Expense</div>

            <div class="form-group">
                <label>Title</label>
                <input id="title" placeholder="e.g. Lunch, Bus ticket..." />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input id="amount" type="number" min="1" placeholder="0.00" />
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input id="date" type="date" />
                </div>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="category">
                    <option>🍔 Food</option>
                    <option>🚌 Travel</option>
                    <option>🛍️ Shopping</option>
                    <option>💊 Health</option>
                    <option>🎮 Entertainment</option>
                    <option>📚 Education</option>
                    <option>🏠 Bills</option>
                    <option>📦 Other</option>
                </select>
            </div>

            <button class="btn-add" onclick="addExpense()">+ Add Expense</button>
        </div>

        <!-- Chart -->
        <div class="chart-card">
            <div class="chart-title">Spending by Category</div>
            <div class="chart-container">
                <canvas id="pieChart"></canvas>
            </div>
        </div>

    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
        <div class="section-header">
            <div class="section-title">Your Expenses</div>
            <div class="header-actions">
                <span class="expense-count" id="expenseCount">0 items</span>
                <button class="btn-export" onclick="exportCSV()" title="Export as CSV">📄 CSV</button>
                <button class="btn-export btn-export-pdf" onclick="exportPDF()" title="Export as PDF">📑 PDF</button>
            </div>
        </div>
        <div class="expense-list" id="expenseList"></div>
    </div>

</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
    <div class="modal-box">
        <h3>✏️ Edit Expense</h3>
        <div class="form-group">
            <label>Title</label>
            <input id="editTitle" />
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Amount (₹)</label>
                <input id="editAmount" type="number" min="1" />
            </div>
            <div class="form-group">
                <label>Date</label>
                <input id="editDate" type="date" />
            </div>
        </div>
        <div class="form-group">
            <label>Category</label>
            <select id="editCategory">
                <option>🍔 Food</option>
                <option>🚌 Travel</option>
                <option>🛍️ Shopping</option>
                <option>💊 Health</option>
                <option>🎮 Entertainment</option>
                <option>📚 Education</option>
                <option>🏠 Bills</option>
                <option>📦 Other</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeEdit()">Cancel</button>
            <button class="btn-save" onclick="updateExpense()">Save Changes</button>
        </div>
    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal-box" style="text-align:center">
        <div style="font-size:40px;margin-bottom:12px">🗑️</div>
        <h3>Delete Expense?</h3>
        <p style="color:var(--muted);font-size:14px;margin:10px 0 20px">This action cannot be undone.</p>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeDelete()">Cancel</button>
            <button class="btn-danger" onclick="confirmDelete()">Yes, Delete</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="script.js"></script>
</body>
</html>
