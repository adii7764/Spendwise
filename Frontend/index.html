<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpendWise</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg: #0d0f14;
            --surface: #161a23;
            --surface2: #1e2330;
            --border: #272d3d;
            --accent: #7c6af7;
            --accent2: #f7a26a;
            --green: #4ade80;
            --red: #f87171;
            --text: #e8ecf4;
            --muted: #6b7594;
            --card-shadow: 0 4px 24px rgba(0,0,0,0.4);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* === HEADER === */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 28px 40px;
            border-bottom: 1px solid var(--border);
        }

        .logo {
            font-family: 'DM Serif Display', serif;
            font-size: 28px;
            background: linear-gradient(135deg, var(--accent), var(--accent2));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-icon {
            font-size: 28px;
            -webkit-text-fill-color: initial;
            animation: spin3d 3s ease-in-out infinite;
            display: inline-block;
        }

        @keyframes spin3d {
            0%,100% { transform: rotateY(0deg) scaleX(1); }
            25% { transform: rotateY(90deg) scaleX(0.1); }
            50% { transform: rotateY(180deg) scaleX(1); }
            75% { transform: rotateY(270deg) scaleX(0.1); }
        }

        .month-filter {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .month-filter label {
            color: var(--muted);
            font-size: 13px;
            font-weight: 500;
        }

        .month-filter input[type="month"] {
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 14px;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            cursor: pointer;
            outline: none;
        }

        /* === MAIN LAYOUT === */
        .main {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 0;
            min-height: calc(100vh - 85px);
        }

        /* === LEFT PANEL === */
        .left-panel {
            border-right: 1px solid var(--border);
            padding: 32px 28px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* === STATS BAR === */
        .stats-bar {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .stat-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .stat-label {
            font-size: 12px;
            color: var(--muted);
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .stat-value {
            font-family: 'DM Serif Display', serif;
            font-size: 24px;
            color: var(--text);
        }

        .stat-value.green { color: var(--green); }
        .stat-value.accent { color: var(--accent); }

        /* === ADD FORM === */
        .form-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
        }

        .form-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 18px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            color: var(--muted);
            margin-bottom: 6px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select {
            width: 100%;
            background: var(--surface2);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 14px;
            border-radius: 10px;
            font-family: 'DM Sans', sans-serif;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus,
        .form-group select:focus {
            border-color: var(--accent);
        }

        .form-group select option { background: var(--surface2); }

        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

        .btn-add {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, var(--accent), #9b8bf8);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 4px;
        }

        .btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124,106,247,0.4); }
        .btn-add:active { transform: translateY(0); }

        /* === CHART === */
        .chart-card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
        }

        .chart-title {
            font-size: 13px;
            color: var(--muted);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 14px;
        }

        .chart-container { position: relative; height: 200px; }

        /* === RIGHT PANEL === */
        .right-panel {
            padding: 32px 36px;
            overflow-y: auto;
        }

        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .section-title {
            font-family: 'DM Serif Display', serif;
            font-size: 22px;
            color: var(--text);
        }

        .expense-count {
            font-size: 13px;
            color: var(--muted);
            background: var(--surface2);
            padding: 4px 12px;
            border-radius: 20px;
        }

        /* === EXPENSE LIST === */
        .expense-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .expense-item {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .expense-item:hover {
            border-color: var(--accent);
            transform: translateX(4px);
        }

        .expense-left { display: flex; align-items: center; gap: 14px; }

        .cat-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .expense-info .expense-title {
            font-weight: 600;
            font-size: 15px;
            color: var(--text);
        }

        .expense-meta {
            font-size: 12px;
            color: var(--muted);
            margin-top: 3px;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .cat-badge {
            background: var(--surface2);
            padding: 2px 8px;
            border-radius: 6px;
            font-size: 11px;
        }

        .expense-right { display: flex; align-items: center; gap: 12px; }

        .expense-amount {
            font-family: 'DM Serif Display', serif;
            font-size: 20px;
            color: var(--accent2);
        }

        .action-btns { display: flex; gap: 6px; }

        .btn-icon {
            width: 34px;
            height: 34px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 15px;
            transition: all 0.2s;
        }

        .btn-edit { background: rgba(124,106,247,0.15); }
        .btn-edit:hover { background: rgba(124,106,247,0.3); transform: scale(1.1); }
        .btn-delete { background: rgba(248,113,113,0.15); }
        .btn-delete:hover { background: rgba(248,113,113,0.3); transform: scale(1.1); }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--muted);
        }

        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        .empty-state p { font-size: 15px; }

        /* === MODALS === */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(4px);
            z-index: 100;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show { display: flex; }

        .modal-box {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            width: 380px;
            box-shadow: var(--card-shadow);
            animation: popIn 0.25s ease;
        }

        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .modal-box h3 {
            font-family: 'DM Serif Display', serif;
            font-size: 22px;
            margin-bottom: 20px;
        }

        .modal-box .form-group { margin-bottom: 14px; }

        .modal-actions { display: flex; gap: 10px; margin-top: 20px; }

        .btn-save {
            flex: 1;
            padding: 11px;
            background: linear-gradient(135deg, var(--accent), #9b8bf8);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-save:hover { opacity: 0.9; }

        .btn-cancel {
            flex: 1;
            padding: 11px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: 0.2s;
        }

        .btn-cancel:hover { color: var(--text); }

        /* Delete modal */
        .delete-modal-icon { font-size: 40px; margin-bottom: 12px; }
        .delete-modal-text { color: var(--muted); font-size: 14px; margin-bottom: 20px; }

        .btn-danger {
            flex: 1;
            padding: 11px;
            background: var(--red);
            border: none;
            border-radius: 10px;
            color: white;
            font-family: 'DM Sans', sans-serif;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        /* Toast */
        .toast {
            position: fixed;
            bottom: 32px;
            right: 32px;
            background: var(--surface);
            border: 1px solid var(--green);
            color: var(--green);
            padding: 14px 22px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            z-index: 200;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.error { border-color: var(--red); color: var(--red); }

        /* === SCROLLBAR === */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

        @media (max-width: 900px) {
            .main { grid-template-columns: 1fr; }
            .left-panel { border-right: none; border-bottom: 1px solid var(--border); }
            header { padding: 20px; }
            .right-panel { padding: 24px 20px; }
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        <span class="logo-icon">💰</span>
        SpendWise
    </div>
    <div class="month-filter">
        <label>Filter by month</label>
        <input type="month" id="monthFilter" onchange="loadAll()">
    </div>
</header>

<div class="main">

    <!-- LEFT PANEL -->
    <div class="left-panel">

        <!-- Stats -->
        <div class="stats-bar">
            <div class="stat-card">
                <div>
                    <div class="stat-label">Total Spent</div>
                    <div class="stat-value accent" id="totalAmount">₹0</div>
                </div>
                <span style="font-size:28px">💸</span>
            </div>
            <div class="stat-card">
                <div>
                    <div class="stat-label">Transactions</div>
                    <div class="stat-value green" id="totalCount">0</div>
                </div>
                <span style="font-size:28px">📋</span>
            </div>
        </div>

        <!-- Add Form -->
        <div class="form-card">
            <div class="form-title">Add Expense</div>

            <div class="form-group">
                <label>Title</label>
                <input id="title" placeholder="e.g. Lunch, Bus ticket..." />
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Amount (₹)</label>
                    <input id="amount" type="number" min="1" placeholder="0.00" />
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input id="date" type="date" />
                </div>
            </div>

            <div class="form-group">
                <label>Category</label>
                <select id="category">
                    <option>🍔 Food</option>
                    <option>🚌 Travel</option>
                    <option>🛍️ Shopping</option>
                    <option>💊 Health</option>
                    <option>🎮 Entertainment</option>
                    <option>📚 Education</option>
                    <option>🏠 Bills</option>
                    <option>📦 Other</option>
                </select>
            </div>

            <button class="btn-add" onclick="addExpense()">+ Add Expense</button>
        </div>

        <!-- Chart -->
        <div class="chart-card">
            <div class="chart-title">Spending by Category</div>
            <div class="chart-container">
                <canvas id="pieChart"></canvas>
            </div>
        </div>
    </div>

    <!-- RIGHT PANEL -->
    <div class="right-panel">
        <div class="section-header">
            <div class="section-title">Expenses</div>
            <span class="expense-count" id="expenseCount">0 items</span>
        </div>
        <div class="expense-list" id="expenseList"></div>
    </div>

</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="editModal">
    <div class="modal-box">
        <h3>✏️ Edit Expense</h3>
        <div class="form-group">
            <label>Title</label>
            <input id="editTitle" />
        </div>
        <div class="form-row">
            <div class="form-group">
                <label>Amount (₹)</label>
                <input id="editAmount" type="number" min="1" />
            </div>
            <div class="form-group">
                <label>Date</label>
                <input id="editDate" type="date" />
            </div>
        </div>
        <div class="form-group">
            <label>Category</label>
            <select id="editCategory">
                <option>🍔 Food</option>
                <option>🚌 Travel</option>
                <option>🛍️ Shopping</option>
                <option>💊 Health</option>
                <option>🎮 Entertainment</option>
                <option>📚 Education</option>
                <option>🏠 Bills</option>
                <option>📦 Other</option>
            </select>
        </div>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeEdit()">Cancel</button>
            <button class="btn-save" onclick="updateExpense()">Save Changes</button>
        </div>
    </div>
</div>

<!-- DELETE MODAL -->
<div class="modal-overlay" id="deleteModal">
    <div class="modal-box" style="text-align:center">
        <div class="delete-modal-icon">🗑️</div>
        <h3>Delete Expense?</h3>
        <p class="delete-modal-text">This action cannot be undone.</p>
        <div class="modal-actions">
            <button class="btn-cancel" onclick="closeDelete()">Cancel</button>
            <button class="btn-danger" onclick="confirmDelete()">Yes, Delete</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
const API_URL = "http://127.0.0.1:5000";

let currentId = null;
let deleteId = null;
let pieChart = null;

const CATEGORY_STYLES = {
    "🍔 Food":          { bg: "rgba(251,146,60,0.15)", color: "#fb923c" },
    "🚌 Travel":        { bg: "rgba(96,165,250,0.15)", color: "#60a5fa" },
    "🛍️ Shopping":      { bg: "rgba(244,114,182,0.15)", color: "#f472b6" },
    "💊 Health":        { bg: "rgba(52,211,153,0.15)", color: "#34d399" },
    "🎮 Entertainment": { bg: "rgba(167,139,250,0.15)", color: "#a78bfa" },
    "📚 Education":     { bg: "rgba(251,191,36,0.15)", color: "#fbbf24" },
    "🏠 Bills":         { bg: "rgba(248,113,113,0.15)", color: "#f87171" },
    "📦 Other":         { bg: "rgba(107,117,148,0.15)", color: "#6b7594" },
};

const CHART_COLORS = ["#7c6af7","#f7a26a","#4ade80","#f87171","#60a5fa","#fbbf24","#f472b6","#34d399"];

// Set today's date as default
document.getElementById("date").value = new Date().toISOString().split("T")[0];

// Set current month as default filter
const now = new Date();
document.getElementById("monthFilter").value = `${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,"0")}`;

function showToast(msg, isError = false) {
    const t = document.getElementById("toast");
    t.textContent = (isError ? "❌ " : "✅ ") + msg;
    t.className = "toast show" + (isError ? " error" : "");
    setTimeout(() => t.className = "toast", 2800);
}

function getMonth() {
    return document.getElementById("monthFilter").value || "";
}

async function loadAll() {
    await Promise.all([loadExpenses(), loadChart()]);
}

async function loadExpenses() {
    const month = getMonth();
    const url = month ? `${API_URL}/expenses?month=${month}` : `${API_URL}/expenses`;
    const res = await fetch(url);
    const data = await res.json();

    const list = document.getElementById("expenseList");
    list.innerHTML = "";

    if (data.length === 0) {
        list.innerHTML = `
            <div class="empty-state">
                <div class="empty-icon">📭</div>
                <p>No expenses yet. Add your first one!</p>
            </div>`;
        document.getElementById("totalAmount").textContent = "₹0";
        document.getElementById("totalCount").textContent = "0";
        document.getElementById("expenseCount").textContent = "0 items";
        return;
    }

    let total = 0;
    data.forEach(exp => {
        total += Number(exp.amount);
        const style = CATEGORY_STYLES[exp.category] || CATEGORY_STYLES["📦 Other"];
        const emoji = exp.category ? exp.category.split(" ")[0] : "📦";
        const catName = exp.category ? exp.category.split(" ").slice(1).join(" ") : "Other";

        const li = document.createElement("div");
        li.className = "expense-item";
        li.innerHTML = `
            <div class="expense-left">
                <div class="cat-icon" style="background:${style.bg}; color:${style.color}">${emoji}</div>
                <div class="expense-info">
                    <div class="expense-title">${exp.title}</div>
                    <div class="expense-meta">
                        <span class="cat-badge">${catName}</span>
                        <span>${exp.date || "—"}</span>
                    </div>
                </div>
            </div>
            <div class="expense-right">
                <div class="expense-amount">₹${Number(exp.amount).toLocaleString("en-IN", {minimumFractionDigits: 0, maximumFractionDigits: 2})}</div>
                <div class="action-btns">
                    <button class="btn-icon btn-edit" onclick="openEdit(${exp.id}, '${exp.title.replace(/'/g,"\\'")}', ${exp.amount}, '${exp.category}', '${exp.date}')">✏️</button>
                    <button class="btn-icon btn-delete" onclick="openDelete(${exp.id})">🗑️</button>
                </div>
            </div>
        `;
        list.appendChild(li);
    });

    document.getElementById("totalAmount").textContent = "₹" + total.toLocaleString("en-IN", {minimumFractionDigits: 0, maximumFractionDigits: 2});
    document.getElementById("totalCount").textContent = data.length;
    document.getElementById("expenseCount").textContent = `${data.length} item${data.length !== 1 ? "s" : ""}`;
}

async function loadChart() {
    const month = getMonth();
    const url = month ? `${API_URL}/summary?month=${month}` : `${API_URL}/summary`;
    const res = await fetch(url);
    const data = await res.json();

    const labels = data.map(d => d.category);
    const values = data.map(d => d.total);

    if (pieChart) pieChart.destroy();

    if (data.length === 0) return;

    const ctx = document.getElementById("pieChart").getContext("2d");
    pieChart = new Chart(ctx, {
        type: "doughnut",
        data: {
            labels,
            datasets: [{
                data: values,
                backgroundColor: CHART_COLORS.slice(0, data.length),
                borderWidth: 0,
                hoverOffset: 8
            }]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            plugins: {
                legend: {
                    position: "bottom",
                    labels: {
                        color: "#6b7594",
                        font: { family: "DM Sans", size: 11 },
                        boxWidth: 10,
                        padding: 10
                    }
                },
                tooltip: {
                    callbacks: {
                        label: ctx => ` ₹${ctx.raw.toLocaleString("en-IN")}`
                    }
                }
            },
            cutout: "65%"
        }
    });
}

async function addExpense() {
    const title = document.getElementById("title").value.trim();
    const amount = document.getElementById("amount").value;
    const category = document.getElementById("category").value;
    const date = document.getElementById("date").value;

    if (!title) return showToast("Please enter a title", true);
    if (!amount || Number(amount) <= 0) return showToast("Enter a valid amount", true);
    if (!date) return showToast("Please select a date", true);

    const res = await fetch(`${API_URL}/add`, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, amount: Number(amount), category, date })
    });

    if (res.ok) {
        document.getElementById("title").value = "";
        document.getElementById("amount").value = "";
        document.getElementById("date").value = new Date().toISOString().split("T")[0];
        showToast("Expense added!");
        loadAll();
    } else {
        const err = await res.json();
        showToast(err.error || "Something went wrong", true);
    }
}

// EDIT
function openEdit(id, title, amount, category, date) {
    currentId = id;
    document.getElementById("editTitle").value = title;
    document.getElementById("editAmount").value = amount;
    document.getElementById("editCategory").value = category;
    document.getElementById("editDate").value = date;
    document.getElementById("editModal").classList.add("show");
}

function closeEdit() {
    document.getElementById("editModal").classList.remove("show");
}

async function updateExpense() {
    const title = document.getElementById("editTitle").value.trim();
    const amount = document.getElementById("editAmount").value;
    const category = document.getElementById("editCategory").value;
    const date = document.getElementById("editDate").value;

    if (!title) return showToast("Title required", true);
    if (!amount || Number(amount) <= 0) return showToast("Valid amount required", true);

    const res = await fetch(`${API_URL}/update/${currentId}`, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ title, amount: Number(amount), category, date })
    });

    if (res.ok) {
        closeEdit();
        showToast("Expense updated!");
        loadAll();
    } else {
        const err = await res.json();
        showToast(err.error || "Update failed", true);
    }
}

// DELETE
function openDelete(id) {
    deleteId = id;
    document.getElementById("deleteModal").classList.add("show");
}

function closeDelete() {
    document.getElementById("deleteModal").classList.remove("show");
}

async function confirmDelete() {
    await fetch(`${API_URL}/delete/${deleteId}`, { method: "DELETE" });
    closeDelete();
    showToast("Expense deleted!");
    loadAll();
}

// Close modals on overlay click
document.getElementById("editModal").addEventListener("click", e => { if(e.target === e.currentTarget) closeEdit(); });
document.getElementById("deleteModal").addEventListener("click", e => { if(e.target === e.currentTarget) closeDelete(); });

// INIT
loadAll();
</script>
</body>
</html>
